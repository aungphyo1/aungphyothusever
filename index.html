<html>
<head>
    <title>Mining Game Leaderboard</title>
    <script>
        async function fetchLeaderboard() {
            const response = await fetch('https://YOUR_REPLIT_URL/leaderboard');  // Update this with your Replit URL
            const data = await response.json();
            document.getElementById("leaderboard").innerHTML = data;
        }
        fetchLeaderboard();
    </script>
</head>
<body>
    <h1>Leaderboard</h1>
    <pre id="leaderboard">Loading...</pre>
</body>
</html>
